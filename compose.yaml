services:
  dbapp:
    build:
      context: ./dbapp
    expose:
      - "5001"
    volumes:
      - ./sqlite_data:/myapp/instance
    restart: unless-stopped

  webapp:
    build:
      context: ./webapp
    depends_on:
      - dbapp
    environment:
      DBAPP_URL: http://dbapp:5001
    ports:
      - "5000:5000"
    restart: unless-stopped
